<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 16px; font-family: system-ui, sans-serif; text-align: center; }
    button { padding: 10px 24px; font-size: 14px; cursor: pointer; border: none; border-radius: 6px; background: #4f46e5; color: #fff; }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    #auth { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    #auth:empty { margin-top: 0; }
    #auth input { padding: 8px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
    #status { margin-top: 12px; font-size: 13px; color: #555; }
    #xync { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb; font-size: 12px; text-align: left; }
    #xync button { padding: 6px 12px; font-size: 13px; }
    #note { margin-bottom: 8px; color: #dc2626; overflow-wrap: anywhere; }
    #note:empty { display: none; }
    #hint { margin-bottom: 8px; color: #555; }
    #groups { margin-bottom: 8px; }
    .group { margin-bottom: 6px; }
    .group b { display: block; }
    .group span { display: inline-block; margin: 2px 4px 0 0; padding: 0 6px; border-radius: 4px; background: #e5e7eb; cursor: pointer; user-select: none; }
    .group span.only { color: #fff; background: #16a34a; }
    .group span.skip { color: #fff; background: #dc2626; text-decoration: line-through; }
  </style>
</head>
<body>
  <div id="off" hidden>Откройте страницу Bybit, HTX или MEXC.</div>
  <button id="send" hidden>Send Token</button>
  <div id="auth"></div>
  <div id="status"></div>
  <div id="xync" hidden>
    <div id="note"></div>
    <button id="login" hidden>Войти через Telegram</button>
    <div id="filter" hidden>
      <div id="hint"><span id="count"></span>Клик: только → кроме → выкл. С фильтром видны лишь разобранные объявы.</div>
      <div id="groups"></div>
      <button id="apply">Применить</button>
      <button id="reset">Сбросить</button>
    </div>
  </div>
  <script src="panel.js"></script>
  <script src="filter.js"></script>
</body>
</html>
